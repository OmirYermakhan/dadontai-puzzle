<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Дәдөнтай жаным менім — пазл</title>
<meta property="og:title" content="Дәдөнтай жаным менім">
<meta property="og:description" content="Собери наш пазл 💛">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1B1F3B; --night-2:#262B52;
    --gold:#E8C170; --gold-2:#F3D89A; --rose:#F4B6C2;
    --milk:#FFF7F0; --ink:#0E1026;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% -10%, #3A2F5C 0%, var(--night) 55%, #12142A 100%);
    color:var(--milk);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    overscroll-behavior:none;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(2px 2px at 12% 18%, rgba(255,247,240,.7) 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 78% 12%, rgba(255,247,240,.6) 50%, transparent 52%),
      radial-gradient(2px 2px at 88% 40%, rgba(232,193,112,.7) 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 30% 60%, rgba(255,247,240,.45) 50%, transparent 52%),
      radial-gradient(2px 2px at 60% 85%, rgba(244,182,194,.6) 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 8% 82%, rgba(232,193,112,.5) 50%, transparent 52%);
  }
  .screen{position:relative;z-index:1;min-height:100dvh;display:none;flex-direction:column;align-items:center;padding:28px 18px 40px}
  .screen.active{display:flex}

  /* MENU */
  .title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-style:italic;font-size:clamp(40px,9vw,64px);line-height:1;text-align:center;color:var(--gold-2);margin-top:22px;text-shadow:0 0 40px rgba(232,193,112,.25)}
  .title small{display:block;font-style:normal;font-weight:500;font-size:clamp(18px,4vw,24px);color:var(--rose);letter-spacing:.06em;margin-top:8px}
  .heart-line{display:flex;align-items:center;gap:14px;margin:22px 0 30px;color:var(--gold);opacity:.8}
  .heart-line::before,.heart-line::after{content:"";width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .heart-line::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .lead{font-size:15px;color:rgba(255,247,240,.72);margin-bottom:14px;text-align:center}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,420px)}
  .thumb{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:2px solid transparent;background:var(--night-2);cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;padding:0}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb:hover{transform:translateY(-2px)}
  .thumb:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
  .thumb.selected{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,193,112,.25),0 12px 30px rgba(0,0,0,.4);transform:scale(1.03)}
  .thumb.selected::after{content:"♥";position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:15px;display:grid;place-items:center;font-weight:700}
  .thumb.done::before{content:"✓";position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--rose);color:var(--ink);font-size:14px;display:grid;place-items:center;font-weight:700}
  .section{width:min(100%,420px);margin-top:26px}
  .section h3{font-size:13px;font-weight:600;color:rgba(255,247,240,.6);margin-bottom:10px}
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .lvl{background:rgba(255,247,240,.06);border:1.5px solid rgba(255,247,240,.14);color:var(--milk);border-radius:12px;padding:12px 6px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s}
  .lvl b{font-size:19px;font-weight:700}
  .lvl span{font-size:11.5px;color:rgba(255,247,240,.6)}
  .lvl.on{background:rgba(232,193,112,.16);border-color:var(--gold);color:var(--gold-2)}
  .lvl.on span{color:var(--gold-2);opacity:.8}
  .lvl:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
  .btn{font-family:inherit;font-weight:700;font-size:16px;border:0;cursor:pointer;border-radius:999px;padding:16px 28px;transition:transform .12s,filter .12s;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
  .btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--ink);box-shadow:0 10px 30px rgba(232,193,112,.3)}
  .btn-ghost{background:rgba(255,247,240,.08);color:var(--milk);border:1.5px solid rgba(255,247,240,.18)}
  .btn-ghost.on{background:rgba(232,193,112,.18);border-color:var(--gold);color:var(--gold-2)}
  .btn-play{width:min(100%,420px);margin-top:26px;font-size:18px}
  .stats-row{margin-top:18px;font-size:13px;color:rgba(255,247,240,.5)}

  /* GAME */
  #game{padding:12px 10px 14px;height:100dvh;min-height:0}
  .topbar{width:100%;max-width:900px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .back{background:none;border:0;color:var(--milk);font-family:inherit;font-size:15px;cursor:pointer;padding:8px 4px;opacity:.85}
  .game-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:21px;color:var(--gold-2);white-space:nowrap}
  .hud{display:flex;gap:18px;font-size:13px;color:rgba(255,247,240,.6)}
  .hud b{color:var(--milk);font-size:15px;font-variant-numeric:tabular-nums}
  .stage{position:relative;flex:1;min-height:0;width:100%;max-width:900px;border-radius:16px;overflow:hidden;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px rgba(232,193,112,.2)}
  canvas#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas#c.grabbing{cursor:grabbing}
  .loading{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--rose);background:rgba(14,16,38,.7)}
  .zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
  .zoom button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,247,240,.2);background:rgba(27,31,59,.85);color:var(--milk);font-size:20px;cursor:pointer;font-family:inherit}
  .actions{display:flex;gap:8px;margin-top:10px;width:100%;max-width:900px}
  .actions .btn{flex:1;padding:12px 8px;font-size:13.5px}

  /* WIN */
  .overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(14,16,38,.78);backdrop-filter:blur(8px);padding:20px}
  .overlay.show{display:flex}
  .card{width:min(100%,380px);background:linear-gradient(180deg,#2B3060,#1B1F3B);border:1px solid rgba(232,193,112,.35);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 40px 80px rgba(0,0,0,.6);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .card h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:38px;color:var(--gold-2);line-height:1.05}
  .card p{color:var(--rose);margin:10px 0 18px;font-size:15px}
  .card .res{display:flex;justify-content:center;gap:28px;margin-bottom:22px}
  .card .res b{display:block;font-size:26px}
  .card .res span{font-size:12px;color:rgba(255,247,240,.55)}
  .card .btn{width:100%;margin-top:8px}
  .hearts{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
  .hearts i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section class="screen active" id="menu">
  <h1 class="title">Дәдөнтай<br>жаным менім<small>собери наш пазл</small></h1>
  <div class="heart-line">♥</div>
  <p class="lead">Выбери фото</p>
  <div class="gallery" id="gallery"></div>
  <div class="section">
    <h3>Сколько деталей</h3>
    <div class="levels" id="levels">
      <button class="lvl" data-c="3" data-r="3"><b>9</b><span>разминка</span></button>
      <button class="lvl on" data-c="4" data-r="4"><b>16</b><span>легко</span></button>
      <button class="lvl" data-c="6" data-r="8"><b>48</b><span>средне</span></button>
      <button class="lvl" data-c="9" data-r="12"><b>108</b><span>сложно</span></button>
      <button class="lvl" data-c="15" data-r="20"><b>300</b><span>очень сложно</span></button>
      <button class="lvl" data-c="20" data-r="26"><b>520</b><span>как настоящий</span></button>
    </div>
  </div>
  <button class="btn btn-gold btn-play" id="play">Играть</button>
  <div class="stats-row" id="menuStats"></div>
</section>

<section class="screen" id="game">
  <div class="topbar">
    <button class="back" id="back">← Меню</button>
    <div class="game-title">Дәдөнтай жаным менім</div>
    <div class="hud"><span><b id="placed">0</b>/<span id="total">0</span></span><span><b id="time">0:00</b></span></div>
  </div>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="zoom">
      <button id="zin" aria-label="Приблизить">+</button>
      <button id="zout" aria-label="Отдалить">−</button>
      <button id="fit" aria-label="Показать всё" style="font-size:15px">⤢</button>
    </div>
    <div class="loading" id="loading">Нарезаю пазл…</div>
  </div>
  <div class="actions">
    <button class="btn btn-ghost on" id="hintBtn">Подсказка</button>
    <button class="btn btn-ghost" id="shuffleBtn">Перемешать</button>
  </div>
</section>

<div class="overlay" id="win">
  <div class="card">
    <h2>Собрано!</h2>
    <p id="winMsg"></p>
    <div class="res">
      <div><b id="wPieces">0</b><span>деталей</span></div>
      <div><b id="wTime">0:00</b><span>время</span></div>
    </div>
    <button class="btn btn-gold" id="next">Следующее фото</button>
    <button class="btn btn-ghost" id="again">Ещё раз</button>
    <button class="btn btn-ghost" id="share">Поделиться игрой</button>
  </div>
</div>
<div class="hearts" id="hearts"></div>

const $ = s => document.querySelector(s);
const done = new Set();
let selImg = 0, COLS = 4, ROWS = 4;

/* ---------- menu ---------- */
const gallery = $('#gallery');
IMAGES.forEach((src, i) => {
  const b = document.createElement('button');
  b.className = 'thumb' + (i === 0 ? ' selected' : '');
  b.setAttribute('aria-label', 'Фото ' + (i + 1));
  b.innerHTML = `<img src="${src}" alt="">`;
  b.onclick = () => { selImg = i; refreshGallery(); };
  gallery.appendChild(b);
});
function refreshGallery(){
  [...gallery.children].forEach((el, i) => { el.classList.toggle('selected', i === selImg); el.classList.toggle('done', done.has(i)); });
  $('#menuStats').textContent = done.size ? `Собрано ${done.size} из ${IMAGES.length}` : '';
}
$('#levels').onclick = e => {
  const b = e.target.closest('.lvl'); if (!b) return;
  COLS = +b.dataset.c; ROWS = +b.dataset.r;
  [...$('#levels').children].forEach(x => x.classList.toggle('on', x === b));
};
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); window.scrollTo(0,0); }
$('#play').onclick = () => { show('game'); newGame(); };
$('#back').onclick = () => { stopTimer(); show('menu'); };

const hitCtx = document.createElement('canvas').getContext('2d');
let W = 720, H = 960, pw, ph, S, pad, k;
let img, pieces = [], loose = [], lockedCv, lockedCtx, hintOn = true, finished = false;
let scale = 1, ox = 0, oy = 0, minScale = .2, worldB = {x:0,y:0,w:W,h:H};
let secs = 0, timer = null, started = false, dirty = true;
let hE, vE;

const rnd = (a, b) => a + Math.random() * (b - a);
function edgeParams(){
  const s = Math.random() < .5 ? 1 : -1;
  const t = rnd(.09, .115) * s, j = () => rnd(-.03, .03);
  const a=j(), b=j(), c=j(), d=j(), e=j();
  return [[0,0],[.2,a],[.5+b+d,-t+c],[.5-t+b,t+c],[.5-2*t+b-d,3*t+c],[.5+2*t+b-d,3*t+c],[.5+t+b,t+c],[.5+b+d,-t+c],[.8,e],[1,0]];
}
const FLAT = [[0,0],[.1,0],[.2,0],[.33,0],[.45,0],[.55,0],[.67,0],[.8,0],[.9,0],[1,0]];

function buildEdges(){
  hE = []; vE = [];
  for (let r = 0; r <= ROWS; r++){ hE[r] = []; for (let c = 0; c < COLS; c++) hE[r][c] = (r === 0 || r === ROWS) ? FLAT : edgeParams(); }
  for (let r = 0; r < ROWS; r++){ vE[r] = []; for (let c = 0; c <= COLS; c++) vE[r][c] = (c === 0 || c === COLS) ? FLAT : edgeParams(); }
}
function piecePath(r, c){
  const p = new Path2D();
  const top = hE[r][c].map(([l,w]) => [l*pw, w*S]);
  const right = vE[r][c+1].map(([l,w]) => [pw + w*S, l*ph]);
  const bottom = hE[r+1][c].map(([l,w]) => [l*pw, ph + w*S]).reverse();
  const left = vE[r][c].map(([l,w]) => [w*S, l*ph]).reverse();
  p.moveTo(0, 0);
  for (const pts of [top, right, bottom, left])
    for (let i = 1; i < 10; i += 3) p.bezierCurveTo(pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1], pts[i+2][0], pts[i+2][1]);
  p.closePath();
  return p;
}
function makeSprite(pc){
  const cv = document.createElement('canvas');
  cv.width = Math.ceil((pw + 2*pad) * k); cv.height = Math.ceil((ph + 2*pad) * k);
  const g = cv.getContext('2d');
  g.scale(k, k); g.translate(pad, pad);
  g.save(); g.clip(pc.path);
  g.drawImage(img, -pc.tx, -pc.ty, W, H);
  // inner light bevel
  g.lineWidth = 2.5 / Math.min(k, 2); g.strokeStyle = 'rgba(255,255,255,.28)'; g.stroke(pc.path);
  g.restore();
  g.lineWidth = 1.2 / Math.min(k, 2); g.strokeStyle = 'rgba(0,0,0,.5)'; g.stroke(pc.path);
  return cv;
}

async function newGame(){
  stopTimer(); finished = false; secs = 0; started = false; $('#time').textContent = '0:00';
  $('#loading').style.display = 'grid';
  $('#win').classList.remove('show');
  await new Promise(r => setTimeout(r, 30));
  img = await loadImg(IMAGES[selImg]);
  W = img.naturalWidth; H = img.naturalHeight;
  pw = W / COLS; ph = H / ROWS; S = Math.min(pw, ph); pad = .45 * S;
  k = pw < 90 ? 3 : pw < 200 ? 2 : 1;
  buildEdges();
  pieces = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const pc = { r, c, tx: c*pw, ty: r*ph, x: 0, y: 0, locked: false };
    pc.path = piecePath(r, c);
    pieces.push(pc);
  }
  // sprites in chunks to keep UI alive
  for (let i = 0; i < pieces.length; i++){
    pieces[i].sprite = makeSprite(pieces[i]);
    if (i % 60 === 59) await new Promise(r => setTimeout(r, 0));
  }
  lockedCv = document.createElement('canvas'); lockedCv.width = W*2; lockedCv.height = H*2;
  lockedCtx = lockedCv.getContext('2d');
  $('#total').textContent = pieces.length;
  scatter();
  $('#loading').style.display = 'none';
  fitView(); resize();
}
function loadImg(src){ return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; }); }

function scatter(){
  const m = .40 * W, mY = m * H / W;
  worldB = { x: -m - pad, y: -mY - pad, w: W + 2*m + 2*pad, h: H + 2*mY + 2*pad };
  loose = [];
  lockedCtx.clearRect(0, 0, W*2, H*2);
  for (const pc of pieces){
    pc.locked = false;
    let x, y, tries = 0;
    do {
      x = rnd(-m, W + m - pw); y = rnd(-mY, H + mY - ph); tries++;
    } while (x + pw > 0 && x < W && y + ph > 0 && y < H && tries < 50);
    pc.x = x; pc.y = y; loose.push(pc);
  }
  shuffleArr(loose);
  $('#placed').textContent = 0;
  dirty = true;
}
function shuffleArr(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } }

/* view */
function cssSize(){ const r = canvas.getBoundingClientRect(); return { w: r.width, h: r.height }; }
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5), { w, h } = cssSize();
  canvas.width = w * dpr; canvas.height = h * dpr; canvas._dpr = dpr;
  dirty = true;
}
function fitView(){
  const { w, h } = cssSize();
  scale = Math.min(w / worldB.w, h / worldB.h);
  minScale = scale * .7;
  ox = (w - worldB.w * scale) / 2 - worldB.x * scale;
  oy = (h - worldB.h * scale) / 2 - worldB.y * scale;
  dirty = true;
}
function zoomAt(f, cx, cy){
  const ns = Math.max(minScale, Math.min(8, scale * f));
  const wx = (cx - ox) / scale, wy = (cy - oy) / scale;
  scale = ns; ox = cx - wx * scale; oy = cy - wy * scale; dirty = true;
}
$('#zin').onclick = () => { const { w, h } = cssSize(); zoomAt(1.35, w/2, h/2); };
$('#zout').onclick = () => { const { w, h } = cssSize(); zoomAt(1/1.35, w/2, h/2); };
$('#fit').onclick = fitView;
window.addEventListener('resize', () => { resize(); });

/* render */
function draw(){
  requestAnimationFrame(draw);
  if (!dirty || !img) return; dirty = false;
  const dpr = canvas._dpr || 1;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*ox, dpr*oy);
  // board
  ctx.fillStyle = 'rgba(255,247,240,.06)'; ctx.fillRect(0, 0, W, H);
  if (hintOn && !finished){ ctx.globalAlpha = .22; ctx.drawImage(img, 0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.lineWidth = 2 / scale; ctx.strokeStyle = 'rgba(232,193,112,.55)'; ctx.strokeRect(0, 0, W, H);
  if (finished){ ctx.drawImage(img, 0, 0, W, H); return; }
  ctx.drawImage(lockedCv, 0, 0, W, H);
  const sw = pw + 2*pad, sh = ph + 2*pad;
  for (const pc of loose) ctx.drawImage(pc.sprite, pc.x - pad, pc.y - pad, sw, sh);
  if (drag){ // shadow under dragged piece
    const pc = drag.pc;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 18 / scale * 2; ctx.shadowOffsetY = 6 / scale;
    ctx.drawImage(pc.sprite, pc.x - pad, pc.y - pad, sw, sh); ctx.restore();
  }
}
requestAnimationFrame(draw);

/* input */
let drag = null, pan = null, pinch = null;
const ptrs = new Map();
function toLocal(e){ const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function toWorld(p){ return { x: (p.x - ox) / scale, y: (p.y - oy) / scale }; }
function hit(w){
  for (let i = loose.length - 1; i >= 0; i--){
    const pc = loose[i];
    if (w.x < pc.x - pad || w.x > pc.x + pw + pad || w.y < pc.y - pad || w.y > pc.y + ph + pad) continue;
    if (hitCtx.isPointInPath(pc.path, w.x - pc.x, w.y - pc.y)) return pc;
  }
  return null;
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); canvas.setPointerCapture(e.pointerId);
  const p = toLocal(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 1){
    if (finished){ pan = { sx: p.x, sy: p.y, ox, oy }; return; }
    const w = toWorld(p), pc = hit(w);
    if (pc){
      loose.splice(loose.indexOf(pc), 1); loose.push(pc);
      drag = { pc, dx: w.x - pc.x, dy: w.y - pc.y }; dirty = true;
    } else pan = { sx: p.x, sy: p.y, ox, oy };
    canvas.classList.add('grabbing');
  } else if (ptrs.size === 2){
    if (drag){ dropPiece(drag.pc); drag = null; }
    pan = null;
    const [a, b] = [...ptrs.values()];
    pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y), s0: scale, mid: { x: (a.x+b.x)/2, y: (a.y+b.y)/2 }, ox0: ox, oy0: oy };
  }
});
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = toLocal(e); ptrs.set(e.pointerId, p);
  if (pinch && ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x+b.x)/2, y: (a.y+b.y)/2 };
    const ns = Math.max(minScale, Math.min(8, pinch.s0 * d / pinch.d0));
    const wx = (pinch.mid.x - pinch.ox0) / pinch.s0, wy = (pinch.mid.y - pinch.oy0) / pinch.s0;
    scale = ns; ox = mid.x - wx * scale; oy = mid.y - wy * scale; dirty = true;
  } else if (drag){
    const w = toWorld(p); drag.pc.x = w.x - drag.dx; drag.pc.y = w.y - drag.dy; dirty = true;
  } else if (pan){
    ox = pan.ox + (p.x - pan.sx); oy = pan.oy + (p.y - pan.sy); dirty = true;
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (drag){ dropPiece(drag.pc); drag = null; }
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0){ pan = null; canvas.classList.remove('grabbing'); }
  dirty = true;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); const p = toLocal(e); zoomAt(Math.pow(1.0015, -e.deltaY), p.x, p.y); }, { passive: false });

function dropPiece(pc){
  startTimer();
  const snap = Math.max(12, .38 * S);
  if (Math.abs(pc.x - pc.tx) < snap && Math.abs(pc.y - pc.ty) < snap){
    pc.x = pc.tx; pc.y = pc.ty; pc.locked = true;
    loose.splice(loose.indexOf(pc), 1);
    lockedCtx.drawImage(pc.sprite, (pc.x - pad)*2, (pc.y - pad)*2, (pw + 2*pad)*2, (ph + 2*pad)*2);
    $('#placed').textContent = pieces.length - loose.length;
    if (loose.length === 0) win();
  }
  dirty = true;
}

/* timer */
function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function startTimer(){ if (!started){ started = true; timer = setInterval(() => { secs++; $('#time').textContent = fmt(secs); }, 1000); } }
function stopTimer(){ clearInterval(timer); timer = null; }

/* buttons */
$('#hintBtn').onclick = () => { hintOn = !hintOn; $('#hintBtn').classList.toggle('on', hintOn); dirty = true; };
$('#shuffleBtn').onclick = () => { stopTimer(); secs = 0; started = false; finished = false; $('#time').textContent = '0:00'; scatter(); fitView(); };

/* win */
function win(){
  stopTimer(); finished = true; dirty = true; done.add(selImg);
  $('#wPieces').textContent = pieces.length; $('#wTime').textContent = fmt(secs);
  $('#winMsg').textContent = MSGS[Math.random() * MSGS.length | 0];
  rainHearts();
  setTimeout(() => $('#win').classList.add('show'), 1100);
}
function rainHearts(){
  const h = $('#hearts'); h.innerHTML = '';
  const chars = ['♥','♥','✦','♥','✧'], colors = ['#E8C170','#F4B6C2','#FFF7F0'];
  for (let i = 0; i < 44; i++){
    const s = document.createElement('i');
    s.textContent = chars[i % chars.length];
    s.style.left = Math.random()*100 + 'vw'; s.style.color = colors[i % 3];
    s.style.fontSize = 14 + Math.random()*20 + 'px';
    s.style.animationDuration = 2.5 + Math.random()*2 + 's'; s.style.animationDelay = Math.random() + 's';
    h.appendChild(s);
  }
  setTimeout(() => h.innerHTML = '', 5000);
}
$('#next').onclick = () => { selImg = (selImg + 1) % IMAGES.length; refreshGallery(); newGame(); };
$('#again').onclick = () => newGame();
$('#share').onclick = async () => {
  const data = { title: 'Дәдөнтай жаным менім', text: 'Собери наш пазл 💛', url: location.href };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(location.href); $('#share').textContent = 'Ссылка скопирована ✓'; }
  } catch(e){}
};
refreshGallery();
</script>
</body>
</html>
